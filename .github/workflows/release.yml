# Builds Audio Transcriber for Windows, macOS (Apple Silicon) and Linux, then creates a
# tagged GitHub release with the downloads attached. Run it by hand from the Actions tab.
name: Release

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: Release type
        type: choice
        required: true
        default: draft
        options:
          - draft
          - public
      bump:
        description: Version increment
        type: choice
        required: true
        default: patch
        options:
          - patch
          - minor
          - major

# Queue runs so two releases can never pick the same version.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Qt system libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      # The tests replace Whisper with a fake, so PyTorch is not needed here.
      - name: Install test requirements
        run: python -m pip install PyQt6 pytest

      - name: Run tests
        run: python -m pytest

  version:
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: write # Draft releases are only visible with write access.
    outputs:
      tag: ${{ steps.next.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Work out next version
        id: next
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BUMP: ${{ inputs.bump }}
          RELEASE_TYPE: ${{ inputs.release_type }}
        run: |
          tag=$(
            {
              git tag --list
              gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq '.[].tag_name'
            } | bash .github/scripts/next_version.sh "$BUMP"
          )
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Building $tag as a $RELEASE_TYPE release ($BUMP)" >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: windows-x64
            mode: --onefile
          - os: macos-latest
            target: macos-arm64
            mode: --onedir # PyInstaller is dropping --onefile for macOS app bundles.
          - os: ubuntu-24.04
            target: linux-x64
            mode: --onefile
    env:
      TAG: ${{ needs.version.outputs.tag }}
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Qt system libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Confirm Apple Silicon (macOS)
        if: runner.os == 'macOS'
        run: test "$(uname -m)" = arm64

      - name: Add version to the app
        shell: bash
        run: echo "__version__ = \"${TAG#v}\"" > audio_transcriber/_version.py

      # The default Linux PyTorch includes several GB of CUDA libraries. Use the CPU build.
      - name: Install CPU PyTorch (Windows, Linux)
        if: runner.os != 'macOS'
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install dependencies
        run: python -m pip install . pyinstaller

      - name: Check Qt is available
        run: python -c "from PyQt6 import QtWidgets; print('PyQt6 OK')"

      - name: Build
        shell: bash
        run: >
          pyinstaller --noconfirm ${{ matrix.mode }} --windowed
          --name Audio-Transcriber --paths .
          --collect-data whisper
          audio_transcriber/__main__.py

      # Loads Whisper, PyTorch, the tokenizer and the audio filters from inside the build.
      - name: Check the build includes Whisper and its data files (macOS)
        if: runner.os == 'macOS'
        timeout-minutes: 5
        run: dist/Audio-Transcriber.app/Contents/MacOS/Audio-Transcriber --self-test

      - name: Check the build includes Whisper and its data files (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: dist/Audio-Transcriber --self-test

      - name: Check the build includes Whisper and its data files (Windows)
        if: runner.os == 'Windows'
        timeout-minutes: 5
        shell: pwsh
        run: |
          $p = Start-Process dist/Audio-Transcriber.exe -ArgumentList '--self-test' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Self-test failed with exit code $($p.ExitCode)" }

      - name: Package
        shell: bash
        run: |
          mkdir out
          name="Audio-Transcriber-$TAG-$TARGET"
          case "$RUNNER_OS" in
            Windows) cp dist/Audio-Transcriber.exe "out/$name.exe" ;;
            macOS) ditto -c -k --keepParent dist/Audio-Transcriber.app "out/$name.zip" ;;
            Linux) tar -czf "out/$name.tar.gz" -C dist Audio-Transcriber ;;
          esac

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: out/*
          if-no-files-found: error

  release:
    needs: [version, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.version.outputs.tag }}
      RELEASE_TYPE: ${{ inputs.release_type }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true

      - name: Create tag
        run: |
          gh api "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA"

      - name: Create release
        run: |
          flags=()
          if [ "$RELEASE_TYPE" = draft ]; then
            flags+=(--draft)
          fi
          gh release create "$TAG" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Audio Transcriber $TAG" \
            --generate-notes \
            "${flags[@]}"
