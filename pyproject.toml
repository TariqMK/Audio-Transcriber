# Package metadata and dependencies for Verbatica. The version is read from verbatica/_version.py.
[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "verbatica"
dynamic = ["version"]
description = "Transcribe audio and video files locally with Whisper models (faster-whisper)."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "faster-whisper",
    # faster-whisper 1.2.1 passes av.open(metadata_errors=...), which PyAV 19 removed.
    "av<19",
    "PyQt6",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.gui-scripts]
verbatica = "verbatica.app:main"

[tool.setuptools]
packages = ["verbatica"]

[tool.setuptools.dynamic]
version = { attr = "verbatica._version.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
