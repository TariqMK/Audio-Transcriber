# Package metadata and dependencies for Audio Transcriber. The version is read from audio_transcriber/_version.py.
[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "audio-transcriber"
dynamic = ["version"]
description = "Transcribe audio and video files locally with OpenAI Whisper models."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "openai-whisper",
    "PyQt6",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.gui-scripts]
audio-transcriber = "audio_transcriber.app:main"

[tool.setuptools]
packages = ["audio_transcriber"]

[tool.setuptools.dynamic]
version = { attr = "audio_transcriber._version.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
